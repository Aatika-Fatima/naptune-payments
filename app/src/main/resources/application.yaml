server:
  port: 8095

spring:
  application:
    name: naptune-payments
  config:
    # .env lives at the repo root; the second entry covers running from app/.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/naptune_payments}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: "0"
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        embedding:
          api-key: ${GEMINI_API_KEY}

payout:
  scheduling:
    enabled: true
